name: Build BareLauncher Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8 for signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Generate keystore fresh every build
        run: |
          keytool -genkey \
            -keystore /tmp/release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias launcher \
            -dname "CN=BareLauncher,O=App,C=US" \
            -storepass mypassword123 \
            -keypass mypassword123 \
            -storetype JKS
          echo "Keystore created"
          keytool -list -keystore /tmp/release.jks -storepass mypassword123

      - name: Set up JDK 17 for building
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Build and sign release APK
        working-directory: LauncherV15
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g -XX:MaxMetaspaceSize=512m"
        run: |
          gradle :app:assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.jks \
            -Pandroid.injected.signing.store.password=mypassword123 \
            -Pandroid.injected.signing.key.alias=launcher \
            -Pandroid.injected.signing.key.password=mypassword123 \
            -Pandroid.injected.signing.store.type=JKS \
            --no-daemon --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BareLauncher-release-${{ github.run_number }}
          path: LauncherV15/app/build/outputs/apk/release/*.apk
          retention-days: 90
