name: Build BareLauncher

on:
  # Triggers tuned for low CI runtime. We only run the workflow when
  # something actually needs validating end-to-end:
  #
  # - pull_request: lightweight check (lint + unit tests). The full
  #   instrumentation + signed build is skipped on PRs because they
  #   have explicit job-level if-conditions further down — runs ~5 min.
  # - push of a tag matching v* : the actual release gate. Runs the
  #   full pipeline including emulator instrumentation and the
  #   release-publish job. Runs ~10-15 min depending on cold-boot.
  # - workflow_dispatch: manual trigger (for re-runs or one-off
  #   validation). Runs the full pipeline.
  #
  # We deliberately do NOT trigger on push to main. The previous
  # post-merge run on main was duplicative — the PR check already
  # validated the merge content, and the next tag push will be the
  # next gate. Removing it saves ~13 min per release cycle. Net
  # release-cycle CI time dropped from ~40 min (PR + post-merge +
  # tag) to ~15-20 min (PR + tag). Tag format: v<semver>, e.g.
  # v1.1.0; anything not matching `v*` is ignored.
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Common env to avoid repeating the same gradle JVM tuning
# in every job. Daemons stay off so the runner reclaims resources
# between gradle invocations.
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g -XX:MaxMetaspaceSize=512m"
  GRADLE_VERSION: "8.14.1"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Quality gate: lint + JVM unit tests. Runs on every PR. Independent
  # of the signing / release pipeline so a broken keystore secret on a
  # fork PR can't block lint feedback.
  # ──────────────────────────────────────────────────────────────────
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: 21

      # The runner ships with a recent Gradle, but we lock to GRADLE_VERSION
      # so reproducibility doesn't drift with image rotations. Installing
      # via SDKMAN avoids depending on gradle/actions/setup-gradle which
      # was failing intermittently against codeload.github.com (one of
      # the transitive infra problems that prompted this workflow split).
      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          mkdir -p "$HOME/gradle" && unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: LauncherV15
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew

      - name: JVM unit tests
        working-directory: LauncherV15
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Android lint (debug)
        working-directory: LauncherV15
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Print lint report on failure
        # When lint fails, dump the full text report inline so the failure
        # is debuggable from the GH Actions log without downloading artifacts.
        # The HTML/XML reports are still uploaded as artifacts below.
        if: failure()
        working-directory: LauncherV15
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            echo "── lint-results-debug.txt ──────────────────────────────"
            cat app/build/reports/lint-results-debug.txt
            echo "── end lint report ─────────────────────────────────────"
          else
            echo "No lint text report at app/build/reports/lint-results-debug.txt"
            find app/build -name 'lint-results*.txt' -print -exec cat {} \;
          fi

      - name: Upload lint report
        # Always upload the report even on failure so the developer can
        # see exactly which issues lint flagged without re-running CI.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            LauncherV15/app/build/reports/lint-results-debug.html
            LauncherV15/app/build/reports/lint-results-debug.xml
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: LauncherV15/app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # Instrumentation smoke test on a real Android emulator. Boots a
  # google_apis x86_64 AVD with KVM acceleration and runs the smoke
  # test under src/androidTest. This is the safety net the project
  # lacked for over a year — until we wired it here, instrumentation
  # tests only compiled, never executed.
  #
  # Runs only on tag pushes (release gate) and workflow_dispatch (for
  # manual re-runs). Skipped on PRs to keep PR feedback under ~5 min:
  # the smoke test is structural (does the activity boot, does the
  # content view lay out), so the marginal value of running it on
  # every PR is small relative to running it once at the actual
  # release gate. Lint + unit tests on every PR catch the bulk of
  # PR-time regressions; a refactor that breaks LauncherActivity
  # construction in a non-lint-detectable way will be caught at tag
  # time before the APK is published.
  #
  # Matrix rows: API 26 (Android 8 — minSdk floor) and API 30 (Android
  # 11 — the previous floor). Both rows exercise the version-gated
  # hideSystemUI path: the API 26 row hits the legacy
  # setSystemUiVisibility flag-based branch; the API 30 row hits the
  # modern WindowInsetsController branch. A code change that breaks
  # the legacy path shows up on the API 26 row; a change that breaks
  # the modern path shows up on the API 30 row.
  #
  # Cost: ~5-7 min per matrix row on a cold boot. With AVD caching
  # disabled (see the long comment in the smoke-test step) and only
  # tag runs invoking instrumentation, total CI cost per release
  # cycle is ~10-12 min for both rows on the tag run.
  # ──────────────────────────────────────────────────────────────────
  instrumentation:
    name: Instrumentation smoke test (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 35
    # Skip on pull_request — emulator boot + smoke test costs ~10 min
    # for both matrix rows, which is the bulk of PR CI time. The PR
    # gate stays at lint + unit tests for fast feedback; the actual
    # release gate (tag push) runs the full pipeline.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        # Two API levels: API 26 (Android 8 — minSdk floor) and API 30
        # (Android 11 — the previous floor). Running both on every PR
        # catches version-gated regressions both ways: a code change
        # that breaks the legacy hideSystemUI path shows up on the API
        # 26 row; a change that breaks the modern WindowInsetsController
        # path shows up on the API 30 row.
        api-level: [26, 30]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: 21

      # Hardware-accelerated emulator execution requires /dev/kvm to be
      # writeable by the runner user. Without this the emulator falls
      # back to software emulation (10x slower) and frequently times
      # out under the action's default 600 s boot deadline.
      # Pattern documented at
      # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          mkdir -p "$HOME/gradle" && unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: LauncherV15
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew

      # Cache the Android SDK system-image tarball for this matrix row.
      # System images are immutable per API revision: when Google ships
      # a security/bugfix revision, it goes into a new directory under
      # system-images/android-${API}/google_apis/x86_64/ — the existing
      # files never get overwritten in place. Caching this directory
      # is therefore purely additive optimization with no race risk.
      # No `default_boot.snapshot` is involved (the booted-AVD cache
      # was the broken thing — see the long comment on the smoke-test
      # step below); we're caching only the one-time SDK tarball that
      # `sdkmanager --install 'system-images;android-${API};...'`
      # otherwise re-downloads (~30-60 sec, ~1 GB) on every CI run.
      #
      # Cache key has no -vN suffix because system-image revisions are
      # rare (sub-yearly per API level) and a cached older revision
      # still works correctly — it just isn't the absolute latest. If
      # we ever need to force-pick up a new revision, append a -vN.
      - name: Cache Android SDK system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}
          key: android-sdk-system-image-${{ matrix.api-level }}-google_apis-x86_64

      # AVD caching is intentionally disabled.
      #
      # We previously cached a `default_boot` snapshot via actions/cache@v4
      # plus a separate "Create AVD and generate snapshot for caching"
      # warm-up step, then resumed from that snapshot in the actual smoke-
      # test step. The save side of that flow has a documented race
      # window: when the warm-up step's emulator exits, the snapshot is
      # captured at whatever point the boot reached, and on roughly every
      # second-to-third release tag run the snapshot landed at the moment
      # `sys.boot_completed=1` is true but `InputManagerService` is not
      # yet registered. Resuming from a snapshot saved during that window
      # makes reactivecircus/android-emulator-runner's auto-unlock
      # `keyevent 82` fire before the input service exists; adb returns
      # non-zero and the action treats it as fatal. Failure surfaces as:
      #
      #   java.lang.IllegalStateException:
      #     android.os.ServiceManager$ServiceNotFoundException:
      #       No service published for: input
      #
      # We chased this by bumping the cache key version four times
      # (-v1 → -v2 → -v3 → -v4 over the v1.1.3 / v1.2.0 release cycles).
      # Each bump bought 1-2 successful runs before the next save landed
      # in the bad window. The pattern made it clear that the save side
      # of the cache flow is the unreliable component, and version-
      # bumping is just deck-chair-shifting.
      #
      # Permanent fix: don't cache a snapshot at all. Cold-boot the
      # emulator on every CI run via `force-avd-creation: true` and
      # `-no-snapshot-save`. Cost is ~3-4 minutes added per matrix-row
      # per run (cold boot vs warm-cache resume); benefit is deterministic
      # CI on every release tag. For a project that ships every few
      # weeks, this tradeoff is correct — release-day flakes are far
      # more expensive than a few minutes of CI runtime.
      #
      # If this becomes painful (e.g. CI quota, expanded matrix), the
      # next steps to investigate are: (1) `actions/cache` for the
      # Android SDK system images themselves (the per-API tarball is
      # ~1 GB and currently re-downloaded each run via sdkmanager —
      # safe to cache because system images are immutable per version);
      # (2) running tests via Firebase Test Lab or an external device-
      # farm runner that doesn't have the snapshot-save race.
      - name: Run instrumentation smoke test
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # force-avd-creation: true — always create a fresh AVD; no
          # state carries between runs, no snapshot to be poisoned.
          force-avd-creation: true
          # -no-snapshot-save — don't write a default_boot.snapshot
          # on shutdown. Pairs with force-avd-creation: true to keep
          # every CI run a clean cold boot of a freshly-created AVD.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: LauncherV15
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-report-api${{ matrix.api-level }}
          path: |
            LauncherV15/app/build/reports/androidTests/connected
            LauncherV15/app/build/outputs/androidTest-results
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # Release pipeline: assemble + sign the production APK. Runs on every
  # main push and on workflow_dispatch. Skipped on PRs (no keystore
  # secret access from forks) — lint+tests above catch breakage there.
  # Depends on `instrumentation` so a smoke-test failure on the real
  # emulator blocks the release artefact from ever being built.
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-24.04
    needs: [quality, instrumentation]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          mkdir -p "$HOME/gradle" && unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks

      - name: Generate Gradle wrapper
        working-directory: LauncherV15
        run: |
          gradle wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew

      - name: Build and sign release APK
        working-directory: LauncherV15
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.signing.store.type=JKS \
            --no-daemon --stacktrace

      # Rename the gradle-default `app-release.apk` to a user-friendly
      # `BareLauncher-<versionName>.apk` so the file the user downloads
      # from a GitHub Release is self-describing. Version is read straight
      # from app/build.gradle.kts to stay in lock-step with whatever the
      # build actually compiled — no separate source of truth.
      - name: Rename APK with version stamp
        id: apk
        working-directory: LauncherV15
        run: |
          set -euo pipefail
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VER" ]; then
            echo "Could not extract versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="app/build/outputs/apk/release/BareLauncher-${VER}.apk"
          mv "$SRC" "$DST"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "apk_path=LauncherV15/${DST}" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BareLauncher-release-${{ github.run_number }}
          path: LauncherV15/app/build/outputs/apk/release/BareLauncher-*.apk
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────
  # Public release: only runs on tag pushes (v*). Pulls the APK that
  # the `build` job just produced in this same workflow run, extracts
  # the matching CHANGELOG.md section as release notes, and creates a
  # GitHub Release with the APK attached. That gives sideload users a
  # permanent download URL (90-day artifacts would otherwise vanish).
  #
  # Uses the gh CLI preinstalled on ubuntu-24.04 runners — no third-
  # party "create-release" action, no extra supply-chain surface.
  # ──────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # required for `gh release create`

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: BareLauncher-release-${{ github.run_number }}
          path: dist

      - name: Extract changelog section for this tag
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.1.0  or  v1.1.3-pre1
          VER="${TAG#v}"                    # e.g. 1.1.0   or  1.1.3-pre1

          # Semver pre-release identifier: anything with a hyphen after the
          # numeric core (v1.2.3-pre1, v1.2.3-rc.1, v1.2.3-beta) is treated
          # as a GitHub "prerelease". Plain v1.2.3 is a stable release.
          PRERELEASE="false"
          case "$VER" in
            *-*) PRERELEASE="true" ;;
          esac

          # Try to pull `## [<VER>]` ... up to the next `## [` heading from
          # CHANGELOG.md. If no matching section exists (e.g. very first
          # release before the changelog has caught up), we fall back to
          # auto-generated release notes below rather than failing the
          # whole pipeline.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              BEGIN { found = 0 }
              /^## \[/ {
                if (found) exit
                if ($0 ~ "^## \\[" ver "\\]") { found = 1; print; next }
              }
              found { print }
            ' CHANGELOG.md > release-notes.md
          else
            : > release-notes.md
          fi

          if [ ! -s release-notes.md ]; then
            echo "::notice::No '## [${VER}]' section in CHANGELOG.md — using fallback release notes."
            {
              if [ "$PRERELEASE" = "true" ]; then
                echo "Pre-release of BareLauncher ${VER}."
                echo
                echo "Early build for testing. Install instructions are in the [README](../../#install)."
              else
                echo "Release of BareLauncher ${VER}."
                echo
                echo "Install instructions are in the [README](../../#install)."
              fi
            } > release-notes.md
          fi

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

          echo "── release notes (prerelease=${PRERELEASE}) ───────────"
          cat release-notes.md
          echo "── end release notes ───────────────────────────────────"

      - name: Verify APK is present
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(dist/BareLauncher-*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No BareLauncher-*.apk found in artifact download."
            exit 1
          fi
          ls -lh "${APKS[@]}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VER: ${{ steps.notes.outputs.version }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Idempotency: if a Release for this tag already exists (e.g. the
          # workflow was re-run), upload assets to the existing one instead
          # of failing. `gh release create` would otherwise error out.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets with --clobber."
            gh release upload "$TAG" dist/BareLauncher-*.apk --clobber
          else
            PRE_FLAG=()
            if [ "$PRERELEASE" = "true" ]; then
              PRE_FLAG=(--prerelease)
            fi
            gh release create "$TAG" \
              --title "BareLauncher $VER" \
              --notes-file release-notes.md \
              "${PRE_FLAG[@]}" \
              dist/BareLauncher-*.apk
          fi
